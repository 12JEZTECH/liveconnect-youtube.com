name: LiveConnect CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q main.py
      - name: Verify required project files
        run: |
          test -f Dockerfile
          test -f render.yaml
          test -f templates/index.html
