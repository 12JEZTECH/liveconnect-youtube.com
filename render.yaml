services:
  - type: web
    name: liveconnect-youtube-2e1h
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liveconnect-postgres
          property: connectionString
databases:
  - name: liveconnect-postgres
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "18"
    diskSizeGB: 1
    ipAllowList: []
